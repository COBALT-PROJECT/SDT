name: Hybrid CI/CD (Runner (test) + Container(build, test and deploy))

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # --------- Job 1: Lint & quick tests on runner ----------
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-asyncio


      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      # - name: Run pyright
      #   run: pyright

      - name: Run unit tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$PWD
          pytest tests/test_core.py -v --cov=core

  # --------- Job 2: Build and push Docker image ----------
  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-test   # only run if lint-test succeeds
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/sdt-main-image:0.2.8 .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sdt-main-image:0.2.8

      - name: Tag & push latest
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/sdt-main-image:0.2.8 \
                     ${{ secrets.DOCKERHUB_USERNAME }}/sdt-main-image:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sdt-main-image:latest
