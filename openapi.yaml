openapi: 3.0.3
info:
  title: SDT Service Interface
  version: v0.2.7
  description: |
    REST API for Security Digital Twin (SDT) Service. Provides endpoints for managing Digital Twin instances, evidence collection, synchronization, authentication with Bearer tokens, and health checks.
servers:
  - url: http://localhost:8001
paths:
  # ================== AUTHENTICATION ENDPOINTS ==================
  /api/SDT/auth/token:
    post:
      summary: Receive OAuth2 Bearer token from SDT-Manager
      description: Store OAuth2 credentials received from SDT-Manager for authenticated communication with IDS-Connector
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sdt_id:
                  type: string
                  description: SDT unique identifier
                access_token:
                  type: string
                  description: OAuth2 access token
                client_id:
                  type: string
                  description: OAuth2 client identifier
                client_secret:
                  type: string
                  description: OAuth2 client secret
                components:
                  type: object
                  description: Component references
              required:
                - sdt_id
                - access_token
                - client_id
      responses:
        '200':
          description: Bearer token stored successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing or invalid required fields
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object

  /api/SDT/auth/token/status:
    get:
      summary: Check current Bearer token status
      description: Returns token availability status without revealing secrets
      tags:
        - Authentication
      responses:
        '200':
          description: Token status
          content:
            application/json:
              schema:
                type: object

  # ================== CORE OPERATIONS (CRUD) ==================
  /api/SDT/create/:
    post:
      summary: Create a new SDT artifact in Ditto
      description: Create a Digital Twin with optional parent thing management.
      tags:
        - Core Operations
      parameters:
        - name: toe_id
          in: query
          required: false
          schema:
            type: string
            default: "00000000-0000-0000-0000-000000000000"
          description: Target of Evaluation ID (UUID)
        - name: category
          in: query
          required: false
          schema:
            type: string
            default: BOMS
          description: Category/type of payload (AI, QDT, BOMS)
        - name: create_parent
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Create/update parent thing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: SDT artifact successfully created
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error creating SDT artifact
          content:
            application/json:
              schema:
                type: object

  /api/SDT/read/:
    get:
      summary: Read an item from the Digital Twin model
      tags:
        - Core Operations
      parameters:
        - name: toe_id
          in: query
          required: false
          schema:
            type: string
            default: "00000000-0000-0000-0000-000000000000"
        - name: category
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item data
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error reading item
          content:
            application/json:
              schema:
                type: object

  /api/SDT/update/:
    put:
      summary: Update an item in the Digital Twin model
      tags:
        - Core Operations
      parameters:
        - name: toe_id
          in: query
          required: false
          schema:
            type: string
            default: "00000000-0000-0000-0000-000000000000"
        - name: category
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated item data
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Failed to update item
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error updating item
          content:
            application/json:
              schema:
                type: object

  /api/SDT/delete/:
    delete:
      summary: Delete an item from the Digital Twin model
      tags:
        - Core Operations
      parameters:
        - name: toe_id
          in: query
          required: false
          schema:
            type: string
            default: "00000000-0000-0000-0000-000000000000"
        - name: category
          in: query
          required: true
          schema:
            type: string
        - name: update_parent
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Update parent thing to remove child reference
      responses:
        '200':
          description: Item deleted successfully
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error deleting item
          content:
            application/json:
              schema:
                type: object

  # ================== CONNECTION MANAGEMENT ==================
  /api/SDT/topology/:
    get:
      summary: Get all Digital Twin things for given TOE IDs
      description: Reads child things via parent thing and fetches each from Ditto. Returns a flat list of all things under the given TOE IDs.
      tags:
        - Connection Management
      parameters:
        - name: toeid
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
            default: ["00000000-0000-0000-0000-000000000000"]
          style: form
          explode: true
          description: One or more TOE IDs to retrieve topology for
      responses:
        '200':
          description: List of Digital Twin things
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
        '500':
          description: Error retrieving topology
          content:
            application/json:
              schema:
                type: object

  /api/SDT/connection/:
    post:
      summary: Establish a connection with Eclipse Ditto
      description: Initializes MQTT connection to Ditto instance for real-time updates.
      tags:
        - Connection Management
      responses:
        '200':
          description: Connection established
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error establishing connection
          content:
            application/json:
              schema:
                type: object

  # ================== EVIDENCE MANAGEMENT ==================
  /api/SDT/evidence/:
    get:
      summary: Retrieve evidence from a Digital Twin with flexible options
      tags:
        - Evidence Management
      parameters:
        - name: toe_id
          in: query
          required: false
          schema:
            type: string
            default: "00000000-0000-0000-0000-000000000000"
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Category/type of evidence (AI, QDT, IDS_Evidence, CLOUD, etc.)
        - name: evidence_type
          in: query
          required: false
          schema:
            type: string
            default: thing
          description: "Type: thing, zip, files, specific, auto"
        - name: files
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of specific files to retrieve
        - name: include_patterns
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated include patterns for ZIP (e.g. *.py,*.h5)
        - name: exclude_patterns
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated exclude patterns for ZIP (e.g. .git/*,*.pyc)
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: json
          description: "Response format: json or download"
        - name: transform
          in: query
          required: false
          schema:
            type: string
          description: Transform name or custom mapping JSON
        - name: include_features
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of specific features to include
        - name: filename
          in: query
          required: false
          schema:
            type: string
          description: Filter by specific filename within the evidence (for FILE category)
      responses:
        '200':
          description: Evidence data or downloadable file
          content:
            application/json:
              schema:
                type: object
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Evidence file not found
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error retrieving evidence
          content:
            application/json:
              schema:
                type: object

  # ================== PARENT THING MANAGEMENT ==================
  /api/SDT/parent/create:
    post:
      summary: Explicitly create a parent thing for a TOE ID
      tags:
        - Parent Thing Management
      parameters:
        - name: toe_id
          in: query
          required: true
          schema:
            type: string
          description: Target of Evaluation ID (UUID)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Parent thing created
          content:
            application/json:
              schema:
                type: object
        '200':
          description: Parent thing already exists
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error creating parent thing
          content:
            application/json:
              schema:
                type: object

  /api/SDT/parent/read:
    get:
      summary: Get the parent thing for a TOE ID
      tags:
        - Parent Thing Management
      parameters:
        - name: toe_id
          in: query
          required: true
          schema:
            type: string
          description: Target of Evaluation ID (UUID)
      responses:
        '200':
          description: Parent thing data
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Parent thing not found
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error reading parent thing
          content:
            application/json:
              schema:
                type: object

  /api/SDT/parent/children:
    get:
      summary: List all child things under a parent thing
      tags:
        - Parent Thing Management
      parameters:
        - name: toe_id
          in: query
          required: true
          schema:
            type: string
          description: Target of Evaluation ID (UUID)
      responses:
        '200':
          description: List of child things
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error listing child things
          content:
            application/json:
              schema:
                type: object

  # ================== DATA SYNCHRONIZATION ==================
  /api/SDT/sync/ids:
    get:
      summary: Sync artifacts from IDS connector to Ditto
      tags:
        - Data Synchronization
      parameters:
        - name: data_path
          in: query
          required: false
          schema:
            type: string
            default: all
          description: "'all' to fetch all resources, or specific resource name"
        - name: toe_id
          in: query
          required: false
          schema:
            type: string
            default: "00000000-0000-0000-0000-000000000000"
          description: Target of Evaluation ID (UUID)
        - name: ids_connector_url
          in: query
          required: false
          schema:
            type: string
          description: IDS Connector base URL (optional, uses config if not provided)
      responses:
        '200':
          description: Sync results
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Not found or bad request
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error in IDS sync
          content:
            application/json:
              schema:
                type: object

  # ================== TEMPLATES MANAGEMENT ==================
  /api/SDT/upload-template:
    post:
      summary: Upload a new template.json file
      tags:
        - Templates Management
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Template uploaded and loaded successfully
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error uploading template
          content:
            application/json:
              schema:
                type: object

  # ================== HEALTH & STATUS ==================
  /api/SDT/health:
    get:
      summary: Check health status of the service and container
      tags:
        - Health & Status
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Health check failed
          content:
            application/json:
              schema:
                type: object
