apiVersion: v1
kind: Pod
metadata:
  name: nginx-test
spec:
  containers:
  - name: nginx-container
    image: docker.io/library/nginx:1.27-alpine #pull from containerd of k3s
    imagePullPolicy: Never
    ports: #binds the pod port 80 on which nginx is running to port 5000 of localhost
    - containerPort: 80
      hostPort: 5000
