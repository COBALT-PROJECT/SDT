apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdt-deployment
  namespace: default
  labels:
    app: sdt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdt
  template:
    metadata:
      labels:
        app: sdt
    spec:
      containers:
        - name: sdt-container
          image: allenabishek/sdt-main-image-ndt:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000 #for API adapter
            - containerPort: 8005 #for controller api
          env:
            - name: DITTO_HOST
              value: "ditto"
            - name: DITTO_PORT
              value: "80"
          volumeMounts:
            - name: sdt-output
              mountPath: /app/sdt_output
      volumes:
        - name: sdt-output
          emptyDir: {}
      restartPolicy: Always
